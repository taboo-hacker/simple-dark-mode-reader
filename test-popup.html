<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Popup</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            width: 400px;
            height: 300px;
            background: #f3f2f1;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        h1 {
            font-size: 18px;
            margin: 0;
        }
        p {
            margin: 0;
            color: #605e5c;
        }
        button {
            padding: 8px 16px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #006cbd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>测试 Popup</h1>
        <p>这是一个测试popup页面，用于验证扩展的popup功能是否正常工作。</p>
        <button id="test-btn">测试按钮</button>
    </div>
    <script>
        document.getElementById('test-btn').addEventListener('click', function() {
            alert('按钮点击成功！');
        });
    </script>
</body>
</html>
