<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dark Mode & Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simple Dark Mode & Reader</h1>
        
        <!-- 深色模式开关 -->
        <div class="option">
            <label for="dark-mode">深色模式</label>
            <label class="switch">
                <input type="checkbox" id="dark-mode">
                <span class="slider round"></span>
            </label>
        </div>
        
        <!-- 阅读模式开关 -->
        <div class="option">
            <label for="reader-mode">阅读模式</label>
            <label class="switch">
                <input type="checkbox" id="reader-mode">
                <span class="slider round"></span>
            </label>
        </div>
        
        <!-- 字体大小调节 -->
        <div class="option">
            <label for="font-size">字体大小: <span id="font-size-value">16</span>px</label>
            <input type="range" id="font-size" min="12" max="24" value="16">
        </div>
        
        <!-- AdGuard 集成 -->
        <div class="option adguard-section">
            <h2>AdGuard 集成</h2>
            <div id="adguard-status" class="status-message">
                检测中...
            </div>
            <button id="open-adguard-assistant" class="adguard-button" disabled>
                打开 AdGuard 助手
            </button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
